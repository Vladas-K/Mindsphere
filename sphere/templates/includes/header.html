{% if user.is_authenticated %}
<header class="staff-bar">
  <div class="staff-bar__inner">
    <a class="staff-bar__brand" href="{% url 'events:index' %}" aria-label="DI EVENT — каталог">DI EVENT<span aria-hidden="true"> / </span><span>{% if user.is_authenticated %}Рабочий раздел{% else %}Каталог{% endif %}</span></a>
    <nav class="staff-bar__nav" aria-label="{% if user.is_authenticated %}Меню сотрудника{% else %}Вход сотрудников{% endif %}">
      {% if user.is_authenticated %}
        <span class="staff-bar__name" title="{{ user.get_full_name|default:user.username }}">{{ user.get_full_name|default:user.username }}</span>
        <a href="{% url 'events:event_create' %}">Добавить программу</a>
        <a href="{% url 'users:password_change' %}">Изменить пароль</a>
        <form method="post" action="{% url 'users:logout' %}">
          {% csrf_token %}<button type="submit">Выйти</button>
        </form>
      {% endif %}
    </nav>
  </div>
</header>
{% endif %}
