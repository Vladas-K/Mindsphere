<div class="mobile-index mobile-only">
  <h2>Выберите<br><span>своё настроение</span></h2>
  <ol>
    {% for program in programs %}
      <li><a href="#program-{{ program.event.pk }}"><span class="mobile-index__number">{{ forloop.counter|stringformat:'02d' }}</span><span>{{ program.event.name }}</span></a></li>
    {% empty %}
      <li>В этой категории пока нет программ.</li>
    {% endfor %}
  </ol>
</div>
